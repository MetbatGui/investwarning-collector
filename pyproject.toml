[project]
name = "investment-hub"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "metbatgui-dev", email = "metbatguidev@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "google-api-python-client>=2.190.0",
    "google-auth-httplib2>=0.3.0",
    "google-auth-oauthlib>=1.2.4",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pykrx>=1.2.3",
    "requests>=2.32.5",
    "seaborn>=0.13.2",
    "xlsxwriter>=3.2.9",
]

[build-system]
requires = ["uv_build>=0.9.4,<0.10.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.2",
]
