[project]
name = "investment-hub"
version = "0.1.0"
description = "KRX 투자경고종목 시세 자동 수집기"
readme = "README.md"
authors = [{ name = "metbatgui-dev", email = "metbatguidev@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "google-api-python-client>=2.190.0",
    "google-auth-httplib2>=0.3.0",
    "google-auth-oauthlib>=1.2.4",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pyarrow>=23.0.1",
    "pykrx>=1.2.3",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "xlsxwriter>=3.2.9",
]

[build-system]
requires = ["uv_build>=0.9.4,<0.10.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "bandit>=1.9.3",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.2",
    "types-requests>=2.32.4.20260107",
]

# ─── Ruff ────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # test 파일은 mock 설정 후 import 허용

# ─── Mypy ────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = false
# 서드파티 라이브러리 stub이 없는 경우가 많으므로 완화 설정
disallow_untyped_defs = false

# ─── Pytest ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

# ─── Coverage ────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["investment_hub"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
